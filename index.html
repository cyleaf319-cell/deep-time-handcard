                bio: "曾任教于威尼斯大学中文系，这段跨文化经历对他的创作产生了很深的影响。对朱迪来说，窑炉就像一个实验场。很多画面的结构其实是在烧制过程中自然形成的。因此他的作品既像绘画，也带有陶瓷材料特有的质感。\n\n朱迪的作品是当代瓷板画的顶尖实验。在当代艺术界，瓷板画的难度远超布面。它需要艺术家在瓷胎上精准控制釉料的干湿，然后交给 1300 度以上的窑火。在炉门打开前，谁也不知道这件作品是否能'存活'。这种'火中取栗'的低成品率，决定了每一件成品都是不可复制的艺术孤品。\n\n他跨文化旅居的经历，让他打破了瓷板画过去作为'工艺美术'的局限，将其彻底带入当代艺术语境。釉料质感的独特与油画笔触形成区别。这是'材料本身在说话'，也是我们深时美术馆一直推崇的'物质叙事'。",

                        title: "散落系列",
                        englishTitle: "Crumblings",
                        description: "这次展出的两件作品来自沈厉的\"散落系列\"。在这个系列中，他将不同材料不断叠加与覆盖，让表面结构像被时间侵蚀过一样逐渐松动、裂开和漂移。画面里的元素仿佛在缓慢漂浮或坠落，因此他把这个系列命名为\"散落\"。观看他的作品像是在观察一块被放大的岩石结构。",
                        descriptionEn: "The two works exhibited this time are from Shen Li's \"Crumblings\" series. In this series, he continuously layers and covers different materials, allowing the surface structure to gradually loosen, crack, and drift as if eroded by time. The elements in the image seem to be slowly floating or falling, hence he named this series \"Crumblings.\" Viewing his work is like observing an enlarged rock structure."
                    }
                ]
            },
            {
                id: "xiaocao",
                name: "小草",
                englishName: "Xiao Cao",
                bio: "以自由艺术家的身份持续进行陶瓷与釉画创作。她的创作灵感往往来自自然中的细微观察，比如植物的生长、色彩的变化，或者自然表面的肌理。通过高温釉色的流动与叠加，她让画面形成一种类似自然生长的节奏。",
                bioEn: "She continues to create ceramics and glaze paintings as an independent artist. Her creative inspiration often comes from subtle observations in nature, such as plant growth, color changes, or natural surface textures. Through the flowing and layering of high-temperature glazes, she creates a rhythm in her images similar to natural growth.",
                artworks: [
                    {
                        title: "晴雨",
                        englishTitle: "Sunnyrain",
                        description: "这件作品的画面像是一种天气变化的瞬间。暖色与冷色在交错流动，让人联想到阳光与雨水同时出现的时刻——也就是作品标题所说的\"晴雨\"。整体看起来既像自然景象，又带有一种轻盈的节奏感。",
                        descriptionEn: "The image in this work is like a moment of weather change. Warm and cool colors flow and interweave, evoking the moment when sunshine and rain appear simultaneously - which is what the title \"Sunnyrain\" describes. Overall, it looks both like a natural scene and carries a light rhythmic quality."
                    },
                    {
                        title: "探",
                        englishTitle: "Explore",
                        description: "这件作品的色彩更加鲜明，也更有一种向外生长的力量。蓝色背景中，大量垂直流动的釉色像瀑布或者植物的根系，从上方延展下来，形成一种非常活跃的视觉节奏。",
                        descriptionEn: "The colors in this work are more vivid, with a stronger sense of outward growth. Against the blue background, abundant vertically flowing glazes extend downward like waterfalls or plant root systems, creating a very active visual rhythm."
                    }
                ]
            },
            {
                id: "guozilong",
                name: "郭子龙",
                englishName: "Guo Zilong",
                bio: "郭子龙毕业于清华大学美术学院，长期从事雕塑与空间装置创作。他以金属和综合材料为媒介，他用金属去做线条、体块和支撑关系，让雕塑在空间里产生一种持续向外延展的张力。",
                bioEn: "Guo Zilong graduated from the Academy of Arts & Design at Tsinghua University and has been engaged in sculpture and spatial installation creation for a long time. Using metal and mixed media as his medium, he creates lines, masses, and supporting relationships with metal, generating a continuously outward-extending tension in space.",
                artworks: [
                    {
                        title: "竹叶",
                        englishTitle: "Bamboo Leaves",
                        description: "不锈钢的金属光泽和镂空形成的阴影，让这幅作品在不同灯光下会有种\"呼吸感\"。它不再是那种文人画里的弱不禁风，而是一种非常有力量、有逻辑的秩序美。它更像是艺术家在试图用冰冷的现代材料，去复刻一种古老的东方禅意。",
                        descriptionEn: "The metallic luster of stainless steel and the shadows formed by the hollow-out patterns give this work a \"breathing\" quality under different lighting. It's no longer the delicate fragility of literati painting, but a very powerful, logical order of beauty. It's more like the artist is trying to replicate an ancient Eastern Zen spirit using cold modern materials."
                    }
                ]
            }
        ];

        let state = { lang: 'zh', query: '', view: 'list', activeArtist: null };

        function render() {
            const root = document.getElementById('app');
            const filtered = artists.filter(a => 
                a.name.includes(state.query) || 
                (a.englishName && a.englishName.toLowerCase().includes(state.query.toLowerCase()))
            );

            if (state.view === 'detail') {
                root.innerHTML = renderDetail(state.activeArtist);
            } else {
                root.innerHTML = renderList(filtered);
            }
            lucide.createIcons();
            window.scrollTo(0, 0);
        }

        function renderList(list) {
            return `
                <header class="glass sticky top-0 z-50 p-5 pb-4">
                    <div class="flex justify-between items-start mb-5">
                        <div>
                            <h1 class="text-2xl font-bold tracking-tighter text-white">深时美术馆 <span class="text-blue-500">.</span></h1>
                            <p class="text-[10px] text-zinc-500 uppercase tracking-[0.2em] mt-1">Deep Time Gallery / Sales Pro</p>
                        </div>
                        <button onclick="toggleLang()" class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center text-xs font-bold hover:bg-white/5 active:scale-90 transition">
                            ${state.lang === 'zh' ? 'EN' : '中'}
                        </button>
                    </div>
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-4 top-3.5 w-4 h-4 text-zinc-500"></i>
                        <input type="text" oninput="doSearch(event)" placeholder="${state.lang === 'zh' ? '搜索艺术家...' : 'Search artists...'}" 
                            class="w-full bg-white/5 border border-white/10 rounded-2xl py-3.5 pl-12 pr-4 text-sm focus:outline-none focus:border-blue-500/40 transition">
                    </div>
                </header>

                <main class="flex-1 p-5 space-y-4">
                    ${list.map(a => `
                        <div onclick='openArtist("${a.id}")' class="glass p-6 rounded-[2rem] active:scale-[0.98] transition-all group cursor-pointer">
                            <h3 class="text-xl font-bold text-white group-hover:text-blue-400 transition mb-3">${state.lang === 'zh' ? a.name : a.englishName}</h3>
                            <p class="text-sm text-zinc-400 leading-relaxed line-clamp-3 whitespace-pre-line">${state.lang === 'zh' ? a.bio : a.bioEn}</p>
                            <div class="mt-5 flex items-center text-[10px] text-zinc-600 font-bold tracking-widest uppercase">
                                <span>Learn More</span>
                                <i data-lucide="arrow-right" class="w-3 h-3 ml-1.5 group-hover:translate-x-1 transition-transform"></i>
                            </div>
                        </div>
                    `).join('')}
                    ${list.length === 0 ? '<p class="text-center py-20 text-zinc-600">未找到相关内容</p>' : ''}
                </main>
                <footer class="p-8 text-center text-[9px] text-zinc-600 tracking-[0.3em] uppercase opacity-50 safe-area-bottom">Deep Time Young © 2026</footer>
            `;
        }

        function renderDetail(a) {
            return `
                <div class="animate-in fade-in slide-in-from-right-10 duration-500 flex flex-col min-h-screen">
                    <nav class="glass sticky top-0 z-50 p-5 flex items-center justify-between">
                        <button onclick="goBack()" class="flex items-center text-zinc-400"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                        <span class="font-bold text-sm tracking-tight">${state.lang === 'zh' ? a.name : a.englishName}</span>
                        <div class="w-6"></div>
                    </nav>

                    <div class="p-6 space-y-10 flex-1">
                        <section>
                            <h4 class="text-[10px] font-black text-blue-500 uppercase tracking-[0.25em] mb-4">${state.lang === 'zh' ? '艺术家背景' : 'The Artist'}</h4>
                            <p class="text-zinc-200 leading-relaxed text-sm whitespace-pre-line">${state.lang === 'zh' ? a.bio : a.bioEn}</p>
                        </section>

                        <section>
                            <h4 class="text-[10px] font-black text-blue-500 uppercase tracking-[0.25em] mb-5">${state.lang === 'zh' ? '核心作品解析' : 'Featured Artworks'}</h4>
                            <div class="space-y-4">
                                ${a.artworks.map(w => `
                                    <div class="p-5 rounded-3xl bg-white/[0.03] border border-white/5">
                                        <div class="font-bold text-white mb-2">${state.lang === 'zh' ? w.title : w.englishTitle}</div>
                                        <p class="text-xs text-zinc-400 leading-relaxed whitespace-pre-line">${state.lang === 'zh' ? w.description : w.descriptionEn}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </section>

                        ${a.salesScenarios && a.salesScenarios.length > 0 ? `
                        <section class="pb-10">
                            <h4 class="text-[10px] font-black text-amber-500 uppercase tracking-[0.25em] mb-5">${state.lang === 'zh' ? '销售话术实战' : 'Sales Scripts'}</h4>
                            <div class="space-y-4">
                                ${a.salesScenarios.map(s => `
                                    <div class="scenario-card p-6 rounded-[2rem] relative overflow-hidden">
                                        <div class="text-[12px] font-black text-amber-500 mb-1">${state.lang === 'zh' ? s.title : s.titleEn}</div>
                                        <div class="text-[10px] text-amber-500/80 mb-3 border-b border-amber-500/20 pb-2">
                                            <div>🎯 ${state.lang === 'zh' ? s.target : s.targetEn}</div>
                                            <div class="mt-1">🖼️ ${state.lang === 'zh' ? s.targetArtworks : s.targetArtworksEn}</div>
                                            <div class="mt-1">💡 ${state.lang === 'zh' ? s.keyPoints : s.keyPointsEn}</div>
                                        </div>
                                        <p class="text-sm text-zinc-100 leading-relaxed whitespace-pre-line italic relative z-10">"${state.lang === 'zh' ? s.script : s.scriptEn}"</p>
                                        <i data-lucide="quote" class="absolute -right-2 bottom-2 w-16 h-16 opacity-5 rotate-12"></i>
                                    </div>
                                `).join('')}
                            </div>
                        </section>` : ''}
                    </div>
                </div>
            `;
        }

        window.toggleLang = () => { state.lang = state.lang === 'zh' ? 'en' : 'zh'; render(); };
        window.doSearch = (e) => { state.query = e.target.value; render(); };
        window.openArtist = (id) => { state.activeArtist = artists.find(a => a.id === id); state.view = 'detail'; render(); };
        window.goBack = () => { state.view = 'list'; render(); };

        render();
    </script>
</body>
</html>
