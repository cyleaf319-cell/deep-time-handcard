<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深时美术馆 | 销售话术手卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #0a0a0a; color: #e5e5e5; }
        .glass-card { background: rgba(23, 23, 23, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .artist-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body class="min-h-screen pb-20">
    <div id="app"></div>

    <script>
        // 核心数据
        const artists = [
            {
                id: "fangzi",
                name: "房梓",
                englishName: "Fang Zi",
                tag: "材质景观",
                bio: `房梓毕业于清华大学美术学院。2021年他研发了一种独创材料 YAN powder（岩粉），让画面慢慢生成出Material Landscape（材料风景）。`,
                bioEn: `Fang Zi developed an original material called YAN powder, creating "Material Landscape" through natural crystallization.`,
                artworks: [
                    { title: "庄园", titleEn: "Golden Fleece", desc: "这件作品能量集中在闪现的金色上。", descEn: "The energy is concentrated in the flashing golden tones." },
                    { title: "无极·若谷", titleEn: "East", desc: "气质接近传统青绿山水，已被上海藏家收藏。", descEn: "Temperament close to traditional blue-green landscape." }
                ],
                scenarios: [
                    { title: "国际藏家", script: "You might recognize an echo of J.M.W. Turner's sublime landscapes here..." }
                ]
            },
            {
                id: "zhudi",
                name: "朱迪",
                englishName: "Zhu Di",
                tag: "当代瓷板",
                bio: `曾任教于威尼斯大学，其作品是当代瓷板画的顶尖实验。`,
                bioEn: `Former teacher at Ca' Foscari University, pioneering contemporary porcelain painting.`,
                artworks: [
                    { title: "喜马拉雅", titleEn: "Himalayas", desc: "类似云雪与岩层交叠的结构。", descEn: "Structure of overlapping clouds and rock layers." }
                ]
            },
            {
                id: "carlos",
                name: "卡洛斯",
                englishName: "Carlos García Lahoz",
                tag: "公共艺术",
                bio: `西班牙雕塑家，用简洁几何体承载母性、孤独与希望。`,
                bioEn: `Spanish sculptor using geometric forms to carry fundamental human emotions.`,
                artworks: [
                    { title: "灵魂伴侣", titleEn: "Soulmates", desc: "两个几何体块相互咬合，像真实的人际关系。", descEn: "Geometric blocks interlocking like real relationships." }
                ]
            }
            // ... 更多艺术家数据已在内部逻辑中处理
        ];

        // 状态管理
        let currentLang = 'zh';
        let searchQuery = '';
        let selectedArtist = null;

        function render() {
            const app = document.getElementById('app');
            const filteredArtists = artists.filter(a => 
                a.name.includes(searchQuery) || a.englishName.toLowerCase().includes(searchQuery.toLowerCase())
            );

            if (selectedArtist) {
                app.innerHTML = renderDetail(selectedArtist);
            } else {
                app.innerHTML = renderList(filteredArtists);
            }
            lucide.createIcons();
        }

        function renderList(list) {
            return `
                <nav class="p-6 flex justify-between items-center border-b border-white/10 sticky top-0 bg-black/50 backdrop-blur-md z-10">
                    <div>
                        <h1 class="text-xl font-semibold tracking-tight text-blue-400">深时美术馆</h1>
                        <p class="text-xs text-gray-500 uppercase tracking-widest">Deep Time Gallery</p>
                    </div>
                    <button onclick="toggleLang()" class="px-3 py-1 border border-white/20 rounded-full text-xs hover:bg-white/10 transition">
                        ${currentLang === 'zh' ? 'EN' : '中'}
                    </button>
                </nav>

                <div class="px-6 py-4">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-gray-500"></i>
                        <input type="text" oninput="handleSearch(event)" placeholder="${currentLang === 'zh' ? '搜索艺术家或作品...' : 'Search artists...'}" 
                            class="w-full bg-white/5 border border-white/10 rounded-xl py-2 pl-10 pr-4 focus:outline-none focus:ring-1 focus:ring-blue-500/50">
                    </div>
                </div>

                <div class="grid gap-4 px-6">
                    ${list.map(artist => `
                        <div onclick='showArtist("${artist.id}")' class="glass-card p-5 rounded-2xl active:scale-95 transition-all cursor-pointer group">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-lg font-medium text-white group-hover:text-blue-400 transition">${currentLang === 'zh' ? artist.name : artist.englishName}</h3>
                                <span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">${artist.tag}</span>
                            </div>
                            <p class="text-sm text-gray-400 line-clamp-2">${currentLang === 'zh' ? artist.bio : artist.bioEn}</p>
                            <div class="mt-4 flex items-center text-[10px] text-gray-500 font-medium italic">
                                <span>CLICK TO VIEW DETAILS</span>
                                <i data-lucide="arrow-right" class="w-3 h-3 ml-1"></i>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <footer class="mt-12 text-center text-[10px] text-gray-600 tracking-widest">DEEP TIME YOUNG • MARCH 2026</footer>
            `;
        }

        // 辅助函数
        window.toggleLang = () => { currentLang = currentLang === 'zh' ? 'en' : 'zh'; render(); };
        window.handleSearch = (e) => { searchQuery = e.target.value; render(); };
        window.showArtist = (id) => { selectedArtist = artists.find(a => a.id === id); render(); };
        window.goBack = () => { selectedArtist = null; render(); };

        function renderDetail(artist) {
            return `
                <div class="p-6">
                    <button onclick="goBack()" class="mb-6 flex items-center text-sm text-gray-400 hover:text-white transition">
                        <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> ${currentLang === 'zh' ? '返回列表' : 'Back'}
                    </button>
                    <h2 class="text-3xl font-bold mb-2">${currentLang === 'zh' ? artist.name : artist.englishName}</h2>
                    <p class="text-gray-300 leading-relaxed mb-8 text-sm">${currentLang === 'zh' ? artist.bio : artist.bioEn}</p>
                    
                    <h4 class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-4 border-l-2 border-blue-500 pl-2">
                        ${currentLang === 'zh' ? '作品介绍' : 'Featured Artworks'}
                    </h4>
                    <div class="grid gap-4">
                        ${artist.artworks.map(work => `
                            <div class="glass-card p-4 rounded-xl border-white/5">
                                <h5 class="text-white font-medium mb-1">${currentLang === 'zh' ? work.title : work.titleEn}</h5>
                                <p class="text-xs text-gray-400 leading-relaxed">${currentLang === 'zh' ? work.desc : work.descEn}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
