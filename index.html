<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深时美术馆 | 销售话术手卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --background: #09090b; --foreground: #fafafa; --primary: #3b82f6; --secondary: #27272a; --border: #3f3f46; }
        body { background-color: var(--background); color: var(--foreground); font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(39, 39, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
        .card { background: var(--secondary); border: 1px solid var(--border); border-radius: 1rem; transition: all 0.2s; }
        .card:active { transform: scale(0.98); opacity: 0.9; }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen">

    <div id="app">
        <header class="glass sticky top-0 z-50 p-4">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center">
                    <span class="text-blue-500 font-bold text-lg" id="logo-text">深</span>
                </div>
                <div class="flex-1">
                    <h1 class="text-lg font-semibold" id="title-text">深时美术馆</h1>
                    <p class="text-xs text-zinc-400" id="subtitle-text">销售话术手卡</p>
                </div>
                <button onclick="toggleLang()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-zinc-800 border border-zinc-700 active:scale-95">
                    <i data-lucide="globe" class="w-4 h-4 text-blue-500"></i>
                    <span class="text-xs font-medium" id="lang-btn-text">EN</span>
                </button>
            </div>
            <div id="search-container" class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></i>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜索艺术家或作品..." 
                    class="w-full h-10 pl-10 pr-4 rounded-xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all">
            </div>
        </header>

        <main class="p-4 space-y-3" id="artist-list">
            </main>

        <footer class="p-6 text-center text-xs text-zinc-500" id="footer-info">
            正在加载...
        </footer>
    </div>

    <script>
        // 这里放入您的销售数据
        const data = {
            artists: [
                { id: 1, name: "方滋", enName: "Fang Zi", tags: ["材质景观", "岩粉"], desc: "作品探讨地质时间与艺术创作的交汇。" },
                { id: 2, name: "朱迪", enName: "Zhu Di", tags: ["抽象", "矿物材料"], desc: "利用矿物材料的独特性进行艺术表达。" }
            ]
        };

        let lang = 'zh';
        let query = '';

        function toggleLang() {
            lang = lang === 'zh' ? 'en' : 'zh';
            render();
        }

        function handleSearch() {
            query = document.getElementById('search-input').value.toLowerCase();
            render();
        }

        function render() {
            // 更新文字
            document.getElementById('logo-text').innerText = lang === 'zh' ? '深' : 'D';
            document.getElementById('title-text').innerText = lang === 'zh' ? '深时美术馆' : 'Deep Time Gallery';
            document.getElementById('subtitle-text').innerText = lang === 'zh' ? '销售话术手卡' : 'Sales Script Cards';
            document.getElementById('lang-btn-text').innerText = lang === 'zh' ? 'EN' : '中';
            document.getElementById('search-input').placeholder = lang === 'zh' ? '搜索艺术家或作品...' : 'Search artists...';

            // 过滤并渲染列表
            const filtered = data.artists.filter(a => 
                a.name.toLowerCase().includes(query) || a.enName.toLowerCase().includes(query)
            );

            const listHtml = filtered.map(a => `
                <div class="card p-4 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <h2 class="font-bold text-blue-400">${lang === 'zh' ? a.name : a.enName}</h2>
                        <span class="text-[10px] bg-blue-500/10 text-blue-500 px-2 py-0.5 rounded">${a.tags[0]}</span>
                    </div>
                    <p class="text-sm text-zinc-300 leading-relaxed">${a.desc}</p>
                    <div class="mt-4 flex justify-end text-[10px] text-zinc-500 italic">
                        Click to view details →
                    </div>
                </div>
            `).join('');

            document.getElementById('artist-list').innerHTML = listHtml || `<p class="text-center py-10 text-zinc-500">未找到结果</p>`;
            document.getElementById('footer-info').innerText = `${filtered.length} Artists · Deep Time Young`;
            
            lucide.createIcons(); // 刷新图标
        }

        // 初始化渲染
        render();
    </script>
</body>
</html>
